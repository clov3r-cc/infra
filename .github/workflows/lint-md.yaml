name: Lint Markdown
on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
  pull_request:
permissions: {}
jobs:
  lint:
    name: Lint Markdown
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Lint markdown files
      uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
      with:
        globs: '**/*.md'
        config: .github/.markdownlint.yaml
