---
- name: Validate lego domain configuration
  ansible.builtin.fail:
    msg: "Either lego_domain or lego_domains must be defined"
  when: lego_domain is not defined and lego_domains is not defined

- name: Check if lego binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/lego
  register: __lego_binary

- name: Install lego
  when: not __lego_binary.stat.exists
  block:
    - name: lego | Download lego archive
      environment:
        https_proxy: "{{ proxy_server_url | default('') }}"
      ansible.builtin.get_url:
        url: "https://github.com/go-acme/lego/releases/download/v{{ lego_version }}/lego_v{{ lego_version }}_linux_amd64.tar.gz"
        dest: /tmp/lego.tar.gz
        mode: "0644"

    - name: lego | Extract lego binary
      ansible.builtin.unarchive:
        src: /tmp/lego.tar.gz
        dest: /usr/local/bin
        remote_src: true
        include:
          - lego

    - name: lego | Remove archive
      ansible.builtin.file:
        path: /tmp/lego.tar.gz
        state: absent

    - name: lego | Restore SELinux context on lego binary
      ansible.builtin.command:
        cmd: restorecon -v /usr/local/bin/lego
      check_mode: false
      changed_when: false

- name: Create lego directory
  ansible.builtin.file:
    path: "{{ lego_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy lego environment file
  ansible.builtin.template:
    src: lego-env.j2
    dest: "{{ lego_path }}/lego.env"
    owner: root
    group: root
    mode: "0600"

# lego_domains (list) と lego_domain (string) の両方に対応
- name: Normalize domains list
  ansible.builtin.set_fact:
    __lego_domains: "{{ lego_domains | default([lego_domain]) }}"

- name: Check if certificates already exist
  ansible.builtin.stat:
    path: "{{ lego_path }}/certificates/{{ item }}.crt"
  loop: "{{ __lego_domains }}"
  register: __lego_certs

- name: Obtain initial certificates
  ansible.builtin.shell:
    cmd: >-
      test {{ ansible_check_mode | lower }} = false && /usr/local/bin/lego
      --path {{ lego_path }}
      --email {{ lego_email }}
      --dns {{ lego_dns_provider }}
      --domains {{ __lego_cert_result.item }}
      --accept-tos
      run
    executable: /bin/bash
  environment:
    CF_DNS_API_TOKEN: "{{ lego_cloudflare_api_token }}"
    https_proxy: "{{ proxy_server_url | default('') }}"
  when: not __lego_cert_result.stat.exists
  loop: "{{ __lego_certs.results }}"
  loop_control:
    loop_var: __lego_cert_result
  check_mode: false
  register: __lego_obtain_certs
  failed_when: ansible_check_mode == false and (__lego_cert_result.rc | default(0)) != 0
  changed_when: not ansible_check_mode
  notify: "{{ lego_notify_handlers | default(['Reload nginx']) }}"

- name: lego | Ensure certificates are readable for monitoring
  ansible.builtin.shell:
    cmd: |
      chmod 755 "{{ lego_path }}/certificates"
      chmod 644 "{{ lego_path }}/certificates"/*.crt
  when: __lego_domains | length > 0
  changed_when: false

- name: Deploy lego renew systemd service
  ansible.builtin.template:
    src: lego-renew.service.j2
    dest: /etc/systemd/system/lego-renew.service
    owner: root
    group: root
    mode: "0644"

- name: Deploy lego renew systemd timer
  ansible.builtin.copy:
    src: lego-renew.timer
    dest: /etc/systemd/system/lego-renew.timer
    owner: root
    group: root
    mode: "0644"

- name: Deploy lego-renew logrotate config
  ansible.builtin.copy:
    src: lego-renew.logrotate
    dest: /etc/logrotate.d/lego-renew
    owner: root
    group: root
    mode: "0644"

- name: Enable and start lego renew timer
  ansible.builtin.systemd_service:
    name: lego-renew.timer
    daemon_reload: true
    enabled: true
    state: started

- name: lego | Deploy certificate discovery script
  ansible.builtin.copy:
    src: lego_discover.sh
    dest: /usr/local/bin/lego_discover.sh
    owner: root
    group: root
    mode: '0755'
  when: __lego_domains | length > 0

- name: lego | Deploy Zabbix agent UserParameter config for certificate monitoring
  ansible.builtin.template:
    src: zabbix_agentd_lego.conf.j2
    dest: "{{ zabbix_agentd_conf_dir }}/lego.conf"
    owner: root
    group: root
    mode: '0644'
  when: __lego_domains | length > 0
  notify: Restart zabbix-agent
