---
- name: packages | Install common packages (RedHat)
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.package:
    name:
      # 言語表示を最適化するため導入
      - glibc-all-langpacks
      - langpacks-en
      # nc コマンド
      - nc
      # vim をデフォルトのエディタとして使用
      - vim-enhanced
      # zip ファイルの展開に使用
      - unzip
    state: present

- name: packages | Install common packages (Debian)
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.package:
    name:
      # 言語表示を最適化するため導入
      - locales-all
      # nc コマンド
      - netcat-openbsd
      # vim をデフォルトのエディタとして使用
      - vim
      # zip ファイルの展開に使用
      - unzip
    state: present
