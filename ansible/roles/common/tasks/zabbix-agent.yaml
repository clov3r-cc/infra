---
- name: zabbix-agent | Install Zabbix repository (RedHat)
  when: ansible_facts['os_family'] == 'RedHat'
  environment:
     https_proxy: "{{ proxy_server_url | default('') }}"
  ansible.builtin.dnf:
    name: https://repo.zabbix.com/zabbix/7.0/alma/10/x86_64/zabbix-release-latest-7.0.el10.noarch.rpm
    state: present
    disable_gpg_check: true

- name: zabbix-agent | Install Zabbix repository (Debian)
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    deb: https://repo.zabbix.com/zabbix/7.0/debian/pool/main/z/zabbix-release/zabbix-release_latest_7.0+debian13_all.deb
    state: present

- name: zabbix-agent | Install zabbix-agent
  ansible.builtin.package:
    name: zabbix-agent
    state: present

- name: zabbix-agent | Restore SELinux labels on log directory (RedHat)
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.command: restorecon -R /var/log/zabbix/
  changed_when: false

- name: zabbix-agent | Deploy logrotate config with SELinux restorecon (RedHat)
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.template:
    src: zabbix-agent.logrotate.j2
    dest: /etc/logrotate.d/zabbix-agent
    owner: root
    group: root
    mode: '0644'
  notify: Restart zabbix-agent

- name: zabbix-agent | Ensure config directory exists
  ansible.builtin.file:
    path: "{{ zabbix_agentd_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: zabbix-agent | Deploy configuration
  ansible.builtin.template:
    src: zabbix_agentd.d.j2
    dest: "{{ zabbix_agentd_conf_dir }}/ansible.conf"
    owner: root
    group: root
    mode: '0644'
  notify: Restart zabbix-agent

- name: zabbix-agent | Start and enable zabbix-agent
  ansible.builtin.systemd_service:
    name: zabbix-agent
    state: started
    enabled: true
