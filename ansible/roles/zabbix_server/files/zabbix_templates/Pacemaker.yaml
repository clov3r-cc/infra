zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0899051eeec74aa88d82d8bcf3c6fda9
      name: Cusotmized
    - uuid: d7499a44661641dfbf848a21729401d5
      name: Templates/Applications
  templates:
    - uuid: 7673e17f498c40078601de088b2848a5
      template: Pacemaker
      name: Pacemaker
      description: |
        Cluster-wide Pacemaker/Corosync HA monitoring.
        Monitors node status, quorum, DC, failed actions, resource state, and
        resource placement. Link this template to one logical Zabbix host
        representing the cluster.
        Requires UserParameter definitions in zabbix_agentd_drbd_pacemaker.conf.
      groups:
        - name: Cusotmized
        - name: Templates/Applications
      items:
        - uuid: 5082b70d42474037acfda697b9d86f42
          name: 'Pacemaker: DC node'
          type: ZABBIX_ACTIVE
          key: pacemaker.dc
          delay: 3m
          history: 7d
          value_type: TEXT
          trends: '0'
          description: 'Name of the Designated Controller node.'
          tags:
            - tag: component
              value: pacemaker
        - uuid: d129d25e65a3445d8b24cf38a3b5cb3a
          name: 'Pacemaker: Online nodes count'
          type: ZABBIX_ACTIVE
          key: pacemaker.nodes.online
          history: 7d
          description: 'Number of online cluster nodes reported by crm_mon.'
          tags:
            - tag: component
              value: pacemaker
          triggers:
            - uuid: a0bb9a5910dc48b3b4a5710a34a8e9da
              expression: 'last(/Pacemaker/pacemaker.nodes.online)<{$CLUSTER.EXPECTED_NODES}'
              name: 'Pacemaker: Not enough online nodes on {HOST.HOST}'
              event_name: 'Pacemaker: Not enough online nodes on {HOST.HOST}'
              priority: HIGH
              description: 'One or more cluster nodes are offline. Expected: {$CLUSTER.EXPECTED_NODES} nodes.'
              tags:
                - tag: component
                  value: pacemaker
        - uuid: 1c93d8ed7e674f98b38099d7908c02bb
          name: 'Pacemaker: Offline/Standby nodes count'
          type: ZABBIX_ACTIVE
          key: pacemaker.nodes.standby
          history: 7d
          description: 'Number of offline, standby or unclean cluster nodes.'
          tags:
            - tag: component
              value: pacemaker
        - uuid: 00b27051e90a4b39846a5352a755985d
          name: 'Pacemaker: Quorum status'
          type: ZABBIX_ACTIVE
          key: pacemaker.quorum
          history: 7d
          description: '1 = has quorum, 0 = no quorum (cluster may split-brain).'
          valuemap:
            name: 'Quorum status'
          tags:
            - tag: component
              value: pacemaker
          triggers:
            - uuid: 94c612c6873d492ab5f08428273e5a76
              expression: last(/Pacemaker/pacemaker.quorum)=0
              name: 'Pacemaker: Quorum lost on {HOST.HOST}'
              event_name: 'Pacemaker: Quorum lost on {HOST.HOST}'
              priority: DISASTER
              description: 'Cluster has lost quorum. This may indicate a split-brain or multiple node failures.'
              tags:
                - tag: component
                  value: pacemaker
        - uuid: 3d0fa9ffb9864efba06110523bfe4e9c
          name: 'Pacemaker: Failed Resource Actions'
          type: ZABBIX_ACTIVE
          key: pacemaker.resources.failed
          history: 7d
          description: 'Number of failed resource actions reported by crm_mon.'
          tags:
            - tag: component
              value: pacemaker
          triggers:
            - uuid: da5a3e61860641f1ac9cbc02873e5ab2
              expression: last(/Pacemaker/pacemaker.resources.failed)>0
              name: 'Pacemaker: Failed Resource Actions on {HOST.HOST}'
              event_name: 'Pacemaker: Failed Resource Actions on {HOST.HOST}'
              priority: HIGH
              description: 'There are failed resource actions. Check "pcs status" or "crm_mon -1" for details.'
              tags:
                - tag: component
                  value: pacemaker
        - uuid: 1325955bcf4048ecbc7cd84fb54ff8bd
          name: 'Pacemaker: Group started resources'
          type: ZABBIX_ACTIVE
          key: 'pacemaker.group.status[{$PACEMAKER.GROUP}]'
          delay: 30s
          history: 7d
          description: 'Number of currently Started resources in the Pacemaker group {$PACEMAKER.GROUP}. Compared against the total resource count.'
          tags:
            - tag: component
              value: pacemaker
        - uuid: b5a0f2c9a96343dc95b13a51e1d4c0ce
          name: 'Pacemaker: Group total resources'
          type: ZABBIX_ACTIVE
          key: 'pacemaker.group.total[{$PACEMAKER.GROUP}]'
          delay: 30s
          history: 7d
          description: 'Total number of resources in the Pacemaker group {$PACEMAKER.GROUP} (regardless of state).'
          tags:
            - tag: component
              value: pacemaker
      discovery_rules:
        - uuid: b5986001a85d4f80a11604acd4a844ce
          name: 'Pacemaker: Resource Discovery'
          type: ZABBIX_ACTIVE
          key: 'pacemaker.resources.discover[all]'
          delay: 1h
          filter:
            conditions:
              - macro: '{#RESOURCE.NAME}'
                value: '^(.*)$'
                formulaid: A
          item_prototypes:
            - uuid: 501a2cad1aab456d8287de67afe89322
              name: 'Pacemaker: resource {#RESOURCE.NAME} state'
              type: ZABBIX_ACTIVE
              key: 'pacemaker.resource.state[{#RESOURCE.NAME}]'
              delay: 30s
              history: 7d
              value_type: CHAR
              trends: '0'
              description: 'Current state of Pacemaker resource {#RESOURCE.NAME}.'
              tags:
                - tag: component
                  value: pacemaker
              trigger_prototypes:
                - uuid: 8c8267b1a9a842e3b2237bc848b63e35
                  expression: 'count(/Pacemaker/pacemaker.resource.state[{#RESOURCE.NAME}],#5,"ne","Started")=5'
                  name: 'Pacemaker: resource {#RESOURCE.NAME} has unexpected state ({ITEM.LASTVALUE}) on {HOST.HOST}'
                  event_name: 'Pacemaker: resource {#RESOURCE.NAME} has unexpected state ({ITEM.LASTVALUE}) on {HOST.HOST}'
                  priority: DISASTER
                  description: 'Resource {#RESOURCE.NAME} has remained outside Started state for five consecutive checks (approximately two minutes). Expected: Started.'
                  tags:
                    - tag: component
                      value: pacemaker
            - uuid: 71f87e1e736e4cbab9d3adf845de99de
              name: 'Pacemaker: resource {#RESOURCE.NAME} placement node'
              type: ZABBIX_ACTIVE
              key: 'pacemaker.resource.node[{#RESOURCE.NAME}]'
              delay: 30s
              history: 7d
              value_type: CHAR
              trends: '0'
              description: 'Node or nodes currently hosting Pacemaker resource {#RESOURCE.NAME}.'
              tags:
                - tag: component
                  value: pacemaker
      macros:
        - macro: '{$CLUSTER.EXPECTED_NODES}'
          value: '2'
          description: 'Expected number of online cluster nodes.'
        - macro: '{$PACEMAKER.GROUP}'
          value: zabbix-server-group
          description: 'Pacemaker resource group name used for the group summary.'
      valuemaps:
        - uuid: 9edc01270d944dcaba6c85daf20a2820
          name: 'Quorum status'
          mappings:
            - value: '1'
              newvalue: 'Has quorum'
            - value: '0'
              newvalue: 'No quorum'
  triggers:
    - uuid: 282425df1b17438cbe1df6970a6c83ca
      expression: 'last(/Pacemaker/pacemaker.group.status[{$PACEMAKER.GROUP}])<last(/Pacemaker/pacemaker.group.total[{$PACEMAKER.GROUP}]) and last(/Pacemaker/pacemaker.group.status[{$PACEMAKER.GROUP}],#2)<last(/Pacemaker/pacemaker.group.total[{$PACEMAKER.GROUP}],#2) and last(/Pacemaker/pacemaker.group.status[{$PACEMAKER.GROUP}],#3)<last(/Pacemaker/pacemaker.group.total[{$PACEMAKER.GROUP}],#3) and last(/Pacemaker/pacemaker.group.status[{$PACEMAKER.GROUP}],#4)<last(/Pacemaker/pacemaker.group.total[{$PACEMAKER.GROUP}],#4) and last(/Pacemaker/pacemaker.group.status[{$PACEMAKER.GROUP}],#5)<last(/Pacemaker/pacemaker.group.total[{$PACEMAKER.GROUP}],#5)'
      name: 'Pacemaker: {{$PACEMAKER.GROUP}} group not fully started on {HOST.HOST}'
      event_name: 'Pacemaker: {{$PACEMAKER.GROUP}} group not fully started on {HOST.HOST}'
      priority: DISASTER
      description: 'One or more resources in {[$PACEMAKER.GROUP]} have remained outside Started state for five consecutive checks (approximately two minutes). Expected all resources to be Started.'
      tags:
        - tag: component
          value: pacemaker
