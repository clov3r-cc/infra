zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0899051eeec74aa88d82d8bcf3c6fda9
      name: Cusotmized
    - uuid: d7499a44661641dfbf848a21729401d5
      name: Templates/Applications
  templates:
    - uuid: 83df5276af6a42b2966612ddae0cc007
      template: 'TCP 10051'
      name: 'TCP 10051'
      description: |
        TCP/10051 connectivity monitoring from the Zabbix server or proxy.
        This simple check does not require a Zabbix agent.
        Set {$TCP.10051.TARGET} to a hostname or IP address. Leave it empty
        to use the linked host interface as the target.
      groups:
        - name: Cusotmized
        - name: Templates/Applications
      items:
        - uuid: 0ae42550cca94b99ae5e4b3d83797230
          name: 'TCP/10051: Service availability'
          type: SIMPLE
          key: 'net.tcp.service[tcp,{$TCP.10051.TARGET},10051]'
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Checks whether the target accepts TCP connections on port 10051. Returns 1 when available and 0 when unavailable.'
          valuemap:
            name: 'TCP 10051 service state'
          tags:
            - tag: component
              value: network
            - tag: target
              value: tcp-10051
          triggers:
            - uuid: 767d3fbfa72d45deaf6c1571be8c86dc
              expression: 'count(/TCP 10051/net.tcp.service[tcp,{$TCP.10051.TARGET},10051],#3,,"0")=3'
              name: 'TCP/10051 connection failed on {HOST.HOST}'
              event_name: 'TCP/10051 connection failed on {HOST.HOST}'
              priority: HIGH
              description: 'The Zabbix server or proxy cannot establish a TCP connection to the target on port 10051.'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: tcp-10051
      macros:
        - macro: '{$TCP.10051.TARGET}'
          value: ''
          description: 'Hostname or IP address to check. Leave empty to use the linked host interface.'
      valuemaps:
        - uuid: 5bfd8eefea68414aaf9c57741d75dc7a
          name: 'TCP 10051 service state'
          mappings:
            - value: '1'
              newvalue: Up
            - value: '0'
              newvalue: Down
