zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0899051eeec74aa88d82d8bcf3c6fda9
      name: Cusotmized
    - uuid: d7499a44661641dfbf848a21729401d5
      name: Templates/Applications
  templates:
    - uuid: 3db12991e1f4445fb0d18f671f716408
      template: 'TCP 10050'
      name: 'TCP 10050'
      description: |
        TCP/10050 connectivity monitoring from the Zabbix server or proxy.
        This simple check does not require a Zabbix agent on the monitoring host.
        Set {$TCP.10050.TARGET} to a hostname or IP address. Leave it empty
        to use the linked host interface as the target.
      groups:
        - name: Cusotmized
        - name: Templates/Applications
      items:
        - uuid: 6d059d38f5004ae1a5cc921c221c9c6b
          name: 'TCP/10050: Service availability'
          type: SIMPLE
          key: 'net.tcp.service[tcp,{$TCP.10050.TARGET},10050]'
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Checks whether the target accepts TCP connections on port 10050. Returns 1 when available and 0 when unavailable.'
          valuemap:
            name: 'TCP 10050 service state'
          tags:
            - tag: component
              value: network
            - tag: target
              value: tcp-10050
          triggers:
            - uuid: 0733e427e9e644f5a4fb7de0e65da32a
              expression: 'count(/TCP 10050/net.tcp.service[tcp,{$TCP.10050.TARGET},10050],#3,,"0")=3'
              name: 'TCP/10050 connection failed on {HOST.HOST}'
              event_name: 'TCP/10050 connection failed on {HOST.HOST}'
              priority: HIGH
              description: 'The Zabbix server or proxy cannot establish a TCP connection to the target on port 10050.'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: tcp-10050
      macros:
        - macro: '{$TCP.10050.TARGET}'
          value: ''
          description: 'Hostname or IP address to check. Leave empty to use the linked host interface.'
      valuemaps:
        - uuid: ce3024e5e87a458e83dded69f967b7c8
          name: 'TCP 10050 service state'
          mappings:
            - value: '1'
              newvalue: Up
            - value: '0'
              newvalue: Down
