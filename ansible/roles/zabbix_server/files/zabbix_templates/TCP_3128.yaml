zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0899051eeec74aa88d82d8bcf3c6fda9
      name: Cusotmized
    - uuid: d7499a44661641dfbf848a21729401d5
      name: Templates/Applications
  templates:
    - uuid: d31af659867945189086e3e9160bd056
      template: 'TCP 3128'
      name: 'TCP 3128'
      description: |
        TCP/3128 connectivity monitoring from the Zabbix server or proxy.
        This simple check does not require a Zabbix agent.
        Set {$TCP.3128.TARGET} to a hostname or IP address. Leave it empty
        to use the linked host interface as the target.
      groups:
        - name: Cusotmized
        - name: Templates/Applications
      items:
        - uuid: 3f3b9ff7697743109edb10bb5878ee4b
          name: 'TCP/3128: Service availability'
          type: SIMPLE
          key: 'net.tcp.service[tcp,{$TCP.3128.TARGET},3128]'
          delay: 1m
          history: 7d
          value_type: UNSIGNED
          description: 'Checks whether the target accepts TCP connections on port 3128. Returns 1 when available and 0 when unavailable.'
          valuemap:
            name: 'TCP 3128 service state'
          tags:
            - tag: component
              value: network
            - tag: target
              value: tcp-3128
          triggers:
            - uuid: cc4b7654502c400e90fc67bdfaea77fc
              expression: 'count(/TCP 3128/net.tcp.service[tcp,{$TCP.3128.TARGET},3128],#3,,"0")=3'
              name: 'TCP/3128 connection failed on {HOST.HOST}'
              event_name: 'TCP/3128 connection failed on {HOST.HOST}'
              priority: HIGH
              description: 'The Zabbix server or proxy cannot establish a TCP connection to the target on port 3128.'
              tags:
                - tag: component
                  value: network
                - tag: target
                  value: tcp-3128
      macros:
        - macro: '{$TCP.3128.TARGET}'
          value: '192.168.20.22'
          description: 'Hostname or IP address to check. Leave empty to use the linked host interface.'
      valuemaps:
        - uuid: 298cb5a2f3914c92b48b7275292240e5
          name: 'TCP 3128 service state'
          mappings:
            - value: '1'
              newvalue: Up
            - value: '0'
              newvalue: Down
