zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: d7499a44661641dfbf848a21729401d5
      name: Templates/Applications
  templates:
    - uuid: 2dc06241f47e4eaba6feea9fd811419e
      template: 'Template App Pacemaker Resources by Zabbix active'
      name: 'Template App Pacemaker Resources by Zabbix active'
      description: |
        Zabbix HA stack resource monitoring.
        Monitors Pacemaker group resource state via LLD (Low-Level Discovery).
        Discovers resources in the {$PACEMAKER.GROUP} and creates per-resource
        items and triggers. Replaces the legacy hardcoded per-process items.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 448b37e5860840b7a29219c19762578f
          name: 'Pacemaker: Group started resources'
          type: ZABBIX_ACTIVE
          key: 'pacemaker.group.status[{$PACEMAKER.GROUP}]'
          delay: 30s
          history: 7d
          description: 'Number of currently Started resources in the Pacemaker group {$PACEMAKER.GROUP}. Compared against the total resource count.'
          tags:
            - tag: component
              value: pacemaker
        - uuid: 9f78ad64ffbd4ad0864f6323c3d1a428
          name: 'Pacemaker: Group total resources'
          type: ZABBIX_ACTIVE
          key: 'pacemaker.group.total[{$PACEMAKER.GROUP}]'
          delay: 30s
          history: 7d
          description: 'Total number of resources in the Pacemaker group {$PACEMAKER.GROUP} (regardless of state).'
          tags:
            - tag: component
              value: pacemaker
      discovery_rules:
        - uuid: 54cfc354b8144c19a341669cae96ed8f
          name: 'Pacemaker: Resource Discovery'
          type: ZABBIX_ACTIVE
          key: 'pacemaker.resources.discover[{$PACEMAKER.GROUP}]'
          delay: 1h
          filter:
            conditions:
              - macro: '{#RESOURCE.NAME}'
                value: '^(.*)$'
                formulaid: A
          item_prototypes:
            - uuid: 42ede3aa436448b5a745496f0e8f38ac
              name: 'Pacemaker: resource {#RESOURCE.NAME} state'
              type: ZABBIX_ACTIVE
              key: 'pacemaker.resource.state[{#RESOURCE.NAME}]'
              delay: 30s
              history: 7d
              value_type: CHAR
              trends: '0'
              description: 'Current state of Pacemaker resource {#RESOURCE.NAME}.'
              tags:
                - tag: component
                  value: pacemaker
              trigger_prototypes:
                - uuid: 98700f9ba76f496ebe96eb62109dc5b4
                  expression: 'last(/Template App Pacemaker Resources by Zabbix active/pacemaker.resource.state[{#RESOURCE.NAME}])<>"Started"'
                  name: 'Pacemaker: resource {#RESOURCE.NAME} has unexpected state ({ITEM.LASTVALUE}) on {HOST.HOST}'
                  event_name: 'Pacemaker: resource {#RESOURCE.NAME} has unexpected state ({ITEM.LASTVALUE}) on {HOST.HOST}'
                  priority: DISASTER
                  description: 'Resource {#RESOURCE.NAME} is in {ITEM.LASTVALUE} state. Expected: Started, Promoted, or Master.'
                  tags:
                    - tag: component
                      value: pacemaker
      macros:
        - macro: '{$PACEMAKER.GROUP}'
          value: zabbix-server-group
          description: 'Pacemaker resource group name to monitor.'
  triggers:
    - uuid: 06cd30135a574683b2c58a727b0e984f
      expression: 'last(/Template App Pacemaker Resources by Zabbix active/pacemaker.group.status[{$PACEMAKER.GROUP}])<last(/Template App Pacemaker Resources by Zabbix active/pacemaker.group.total[{$PACEMAKER.GROUP}])'
      name: 'Pacemaker: {{$PACEMAKER.GROUP}} group not fully started on {HOST.HOST}'
      event_name: 'Pacemaker: {{$PACEMAKER.GROUP}} group not fully started on {HOST.HOST}'
      priority: DISASTER
      description: 'One or more resources in {[$PACEMAKER.GROUP]} are not in Started state. Expected all resources to be Started.'
      tags:
        - tag: component
          value: pacemaker
