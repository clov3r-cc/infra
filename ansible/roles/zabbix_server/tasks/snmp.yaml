---
- name: SNMP | Install SNMP packages
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.package:
    name:
      - net-snmp
      - net-snmp-agent-libs
      - net-snmp-devel
      - net-snmp-perl
      - net-snmp-perl-module
      - net-snmp-utils
    state: present

- name: SNMP | Create trap log directory
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.file:
    path: /var/log/snmptrap
    state: directory
    owner: zabbix
    group: zabbix
    mode: '0775'

- name: SNMP | Set SELinux context for trap directory
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.command: semanage fcontext -a -t snmpd_log_t "/var/log/snmptrap(/.*)?"
  register: __semanage_result
  changed_when: '__semanage_result.rc == 0 and "File context already defined" not in __semanage_result.stderr'
  failed_when: false

- name: SNMP | Apply SELinux context to trap directory
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.command: restorecon -RF /var/log/snmptrap
  changed_when: false

- name: SNMP | Install SELinux tools for custom module build
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.package:
    name:
      - checkpolicy
      - policycoreutils-python-utils
    state: present
  tags: [snmp-selinux]

- name: SNMP | Deploy custom SELinux module for Zabbix trap log access
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.copy:
    src: selinux/zabbix_server_snmptrap.te
    dest: /tmp/zabbix_server_snmptrap.te
    owner: root
    group: root
    mode: '0600'
  register: __zabbix_server_snmptrap_selinux_te
  tags: [snmp-selinux]

- name: SNMP | Check loaded SELinux modules
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.command: semodule -l
  register: __zabbix_server_snmptrap_selinux_modules
  changed_when: false
  tags: [snmp-selinux]

- name: SNMP | Compile custom SELinux module
  when:
    - "inventory_hostname in groups['zabbix_server__ha']"
    - >-
      __zabbix_server_snmptrap_selinux_te is changed or
      not (__zabbix_server_snmptrap_selinux_modules.stdout | regex_search('(?m)^zabbix_server_snmptrap(?:\s|$)'))
  ansible.builtin.command: checkmodule -M -m -o /tmp/zabbix_server_snmptrap.mod /tmp/zabbix_server_snmptrap.te
  changed_when: false
  tags: [snmp-selinux]

- name: SNMP | Package custom SELinux module
  when:
    - "inventory_hostname in groups['zabbix_server__ha']"
    - >-
      __zabbix_server_snmptrap_selinux_te is changed or
      not (__zabbix_server_snmptrap_selinux_modules.stdout | regex_search('(?m)^zabbix_server_snmptrap(?:\s|$)'))
  ansible.builtin.command: semodule_package -o /tmp/zabbix_server_snmptrap.pp -m /tmp/zabbix_server_snmptrap.mod
  changed_when: false
  tags: [snmp-selinux]

- name: SNMP | Load custom SELinux module
  when:
    - "inventory_hostname in groups['zabbix_server__ha']"
    - >-
      __zabbix_server_snmptrap_selinux_te is changed or
      not (__zabbix_server_snmptrap_selinux_modules.stdout | regex_search('(?m)^zabbix_server_snmptrap(?:\s|$)'))
  ansible.builtin.command: semodule -i /tmp/zabbix_server_snmptrap.pp
  changed_when: true
  tags: [snmp-selinux]

- name: SNMP | Deploy rsyslog config for snmp trap forwarding
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.template:
    src: 99-snmptrap.conf.j2
    dest: /etc/rsyslog.d/99-snmptrap.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart rsyslog

- name: SNMP | Download zabbix_trap_receiver.pl
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/zabbix/zabbix/master/misc/snmptrap/zabbix_trap_receiver.pl
    dest: /usr/local/bin/zabbix_trap_receiver.pl
    owner: root
    group: root
    mode: '0755'
  environment:
    https_proxy: "{{ proxy_server_url }}"

- name: SNMP | Replace file write with pipe to logger
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.lineinfile:
    path: /usr/local/bin/zabbix_trap_receiver.pl
    regexp: 'unless \(sysopen\(OUTPUT_FILE, \$SNMPTrapperFile,.*?\)\)'
    line: "\tunless (open(OUTPUT_FILE, \"| /usr/bin/logger -t zabbix_trap -p local6.info\"))"

- name: SNMP | Deploy snmpd.conf
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: /etc/snmp/snmpd.conf
    owner: root
    group: root
    mode: '0644'

- name: SNMP | Deploy snmptrapd.conf
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.template:
    src: snmptrapd.conf.j2
    dest: /etc/snmp/snmptrapd.conf
    owner: root
    group: root
    mode: '0644'

- name: SNMP | Deploy Zabbix trapper config
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.template:
    src: SNMP.conf.j2
    dest: /etc/zabbix/zabbix_server.d/SNMP.conf
    owner: zabbix
    group: zabbix
    mode: '0640'

- name: SNMP | Deploy snmptrapd sysconfig
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.template:
    src: snmptrapd.sysconfig.j2
    dest: /etc/sysconfig/snmptrapd
    owner: root
    group: root
    mode: '0644'

- name: SNMP | Deploy logrotate config
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.template:
    src: snmptrap_logrotate.j2
    dest: /etc/logrotate.d/zabbix-snmptrap
    owner: root
    group: root
    mode: '0644'

- name: SNMP | Stop and disable snmpd
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.systemd_service:
    name: snmpd
    state: stopped
    enabled: false

- name: SNMP | Stop and disable snmptrapd
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.systemd_service:
    name: snmptrapd
    state: stopped
    enabled: false

- name: SNMP | Add snmpd to Pacemaker
  when: "inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']"
  pcs_resource:
    name: snmpd
    resource_class: systemd
    resource_type: systemd:snmpd
    options: >-
      op monitor interval="60s"
      --group zabbix-server-group
  run_once: true

- name: SNMP | Add snmptrapd to Pacemaker
  when: "inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']"
  pcs_resource:
    name: snmptrapd
    resource_class: systemd
    resource_type: systemd:snmptrapd
    options: >-
      op monitor interval="60s"
      --group zabbix-server-group
  run_once: true
