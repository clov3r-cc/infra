---
- name: zabbix-server | Install zabbix-server
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.package:
    name:
      - zabbix-server-mysql
      - zabbix-web-mysql
      - zabbix-nginx-conf
      - zabbix-sql-scripts
      - zabbix-selinux-policy
    state: present

- name: zabbix-server | Create zabbix database
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  community.mysql.mysql_db:
    login_unix_socket: /var/lib/mysql/mysql.sock
    name: zabbix
    encoding: utf8mb4
    collation: utf8mb4_bin
    state: present

- name: zabbix-server | Create zabbix user and grant privileges
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  community.mysql.mysql_user:
    login_unix_socket: /var/lib/mysql/mysql.sock
    name: zabbix
    host: localhost
    password: '{{ zabbix_server_db_password }}'
    priv: 'zabbix.*:ALL'
    state: present

- name: zabbix-server | Set log_bin_trust_function_creators
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  community.mysql.mysql_variables:
    login_unix_socket: /var/lib/mysql/mysql.sock
    variable: log_bin_trust_function_creators
    value: 1

- name: zabbix-server | Check if Zabbix schema already imported
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  community.mysql.mysql_query:
    login_unix_socket: /var/lib/mysql/mysql.sock
    login_db: zabbix
    query: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'zabbix'
  register: __zabbix_server_schema_check

- name: zabbix-server | Import Zabbix schema
  when:
    - inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
    - __zabbix_server_schema_check.query_result[0][0]['COUNT(*)'] | int == 0
  community.mysql.mysql_db:
    login_unix_socket: /var/lib/mysql/mysql.sock
    name: zabbix
    state: import
    target: /usr/share/zabbix-sql-scripts/mysql/server.sql.gz
    use_shell: true

- name: zabbix-server | Disable log_bin_trust_function_creators
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  community.mysql.mysql_variables:
    login_unix_socket: /var/lib/mysql/mysql.sock
    variable: log_bin_trust_function_creators
    value: 0

- name: zabbix-server | Enable conf.d include in zabbix_server.conf
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?\s*Include\s*=\s*$'
    line: Include=/etc/zabbix/zabbix_server.conf.d/*.conf

- name: zabbix-server | Deploy database password config
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.copy:
    content: |
      DBPassword={{ zabbix_server_db_password }}
    dest: /etc/zabbix/zabbix_server.conf.d/DBPassword.conf
    owner: zabbix
    group: zabbix
    mode: '0640'

- name: zabbix-server | Configure listen port in zabbix nginx config
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.lineinfile:
    path: /etc/nginx/conf.d/zabbix.conf
    regexp: '^#?\s*listen'
    line: '        listen 443 ssl http2;'

- name: zabbix-server | Configure server_name in zabbix nginx config
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.lineinfile:
    path: /etc/nginx/conf.d/zabbix.conf
    regexp: '^#?\s*server_name'
    line: '        server_name prd-zbx.labo.clov3r.cc;'

- name: zabbix-server | Add SSL certificate directives
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.blockinfile:
    path: /etc/nginx/conf.d/zabbix.conf
    insertafter: '^        server_name'
    marker: "# {mark} ANSIBLE MANAGED: SSL settings"
    block: |2
          ssl_certificate     /etc/lego/certificates/prd-zbx.labo.clov3r.cc.crt;
          ssl_certificate_key /etc/lego/certificates/prd-zbx.labo.clov3r.cc.key;
