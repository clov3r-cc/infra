---
- name: mariadb | Add MariaDB GPG key
  when: "inventory_hostname in groups['zabbix_server__ha']"
  environment:
    https_proxy: "{{ proxy_server_url }}"
  ansible.builtin.rpm_key:
    key: https://mirror.stechnology.jp/mariadb/yum/RPM-GPG-KEY-MariaDB
    state: present

- name: mariadb | Add MariaDB repository
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.yum_repository:
    name: mariadb
    description: MariaDB
    baseurl: https://mirror.stechnology.jp/mariadb/yum/11.8/rhel/$releasever/$basearch
    gpgkey: https://mirror.stechnology.jp/mariadb/yum/RPM-GPG-KEY-MariaDB
    gpgcheck: true
    enabled: true

- name: mariadb | Install MariaDB
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.package:
    name:
      - MariaDB-client
      - MariaDB-server
    state: present

- name: mariadb | Ensure MariaDB datadir exists
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  ansible.builtin.file:
    path: "{{ zabbix_server_mariadb_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: '0755'

- name: mariadb | Configure MariaDB server
  when: "inventory_hostname in groups['zabbix_server__ha']"
  # zz- prefix ensures the file is read last in /etc/my.cnf.d/ (alphabetic order)
  ansible.builtin.template:
    src: mariadb-server.cnf.j2
    dest: /etc/my.cnf.d/zz-mariadb-server.cnf
    mode: '0644'

- name: mariadb | Initialize MariaDB system tables
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  ansible.builtin.command:
    cmd: mariadb-install-db --user=mysql --skip-test-db
    creates: "{{ zabbix_server_mariadb_datadir }}/mysql/user.MAI"
  changed_when: true

- name: mariadb | Install semanage tool
  ansible.builtin.package:
    name: policycoreutils-python-utils
    state: present

- name: mariadb | Set SELinux context for MariaDB datadir
  when: inventory_hostname == hostvars[groups['zabbix_server__ha'][0]]['drbd_active_node']
  block:
    - name: mariadb | Add SELinux fcontext rule for datadir
      ansible.builtin.command:
        cmd: semanage fcontext -a -t mysqld_db_t "{{ zabbix_server_mariadb_datadir }}(/.*)?"
      register: __zabbix_server_mariadb_semanage
      failed_when: false
      changed_when: __zabbix_server_mariadb_semanage.rc == 0

    - name: mariadb | Apply SELinux context to datadir
      ansible.builtin.command:
        cmd: restorecon -Rv "{{ zabbix_server_mariadb_datadir }}"
      changed_when: true

# systemd に操作させず、Pacemaker が管理する
- name: mariadb | Stop and disable mariadb
  when: "inventory_hostname in groups['zabbix_server__ha']"
  ansible.builtin.systemd_service:
    name: mariadb
    state: stopped
    enabled: false

- name: mariadb | Configure MariaDB pacemaker resource
  when: "inventory_hostname in groups['zabbix_server__ha']"
  pcs_resource:
    name: mariadb
    resource_class: ocf
    resource_type: "ocf:heartbeat:mysql"
    options: >-
      datadir={{ zabbix_server_mariadb_datadir }}
      op monitor interval="60s" timeout="30s"
      meta target-role="Started" is-managed="true"
      --group zabbix-server
  run_once: true
