---
- name: Install required packages
  ansible.builtin.package:
    name:
      - squid
      - keepalived
    state: present

- name: Create Keepalived script user
  ansible.builtin.user:
    name: keepalived_script
    system: true
    create_home: false
    home: /
    shell: /sbin/nologin

- name: Deploy Squid health check script
  ansible.builtin.copy:
    dest: /usr/libexec/keepalived/check_squid
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/bash
      exec 3<>/dev/tcp/127.0.0.1/3128 || exit 1
      exec 3>&-
  notify: Reload keepalived

- name: Restore SELinux context for Squid health check script
  ansible.builtin.command:
    cmd: restorecon -Fv /usr/libexec/keepalived/check_squid
  register: __squid_check_script_restorecon
  changed_when: __squid_check_script_restorecon.stdout != ""
  notify: Reload keepalived

- name: Create keepalived directory
  ansible.builtin.file:
    path: /etc/keepalived
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0600"
  notify: Reload keepalived

- name: Enable and start keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    state: started
    enabled: true

- name: Deploy squid configuration
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: squid
    mode: "0640"
  notify: Restart squid

- name: Initialize squid cache directory
  ansible.builtin.shell: test {{ ansible_check_mode | lower }} = false && squid -z
  args:
    creates: "{{ squid_cache_dir }}/swap.state"
  check_mode: false
  register: __squid_init_cache
  failed_when: ansible_check_mode == false and __squid_init_cache.rc != 0

- name: Enable and start squid
  ansible.builtin.systemd_service:
    name: squid
    daemon_reload: true
    enabled: true
    state: started
